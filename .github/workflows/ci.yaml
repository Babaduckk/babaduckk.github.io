name: Deploy MkDocs Site
on:
  push:
    branches:
      - main
jobs:
  Build-Site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: | 
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Site
        run: | 
          mkdocs build --config-file source/mkdocs.yml
          echo "Built in site/ directory"

      - name: Deploy Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: release
          destination_dir: docs
          keep_files: false

      - name: Push to Sourcecraft Repository
        run: |
          git remote add sourcecraft "https://babaduckk:${{ secrets.SRCFT_TOKEN }}@git.sourcecraft.dev/babaduckk/portfolio.git"
          git fetch sourcecraft
          git checkout -b sourcecraft-main sourcecraft/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge main -Xtheirs --no-commit --allow-unrelated-histories
          rm -rf .github
          rm -rf site
          git add -A
          git commit --no-edit
          git push sourcecraft sourcecraft-main:main
          echo "Pushed to Sourcecraft"
          
